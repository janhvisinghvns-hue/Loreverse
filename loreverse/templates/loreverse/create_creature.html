{% extends "loreverse/layout.html" %}

{% block body %}

<div class="container py-5">
    <div class="form-page">
        <div class="form-page-header">
            <p class="text-muted text-uppercase small fw-semibold mb-2">
                {{ story.title }} · World Explorer
            </p>
            <h1 class="fw-bold">Add Creature</h1>
            <p class="text-muted">
                Add a creature that inhabits this world.
            </p>
        </div>

        <div class="form-card">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="form-actions">
                    <button type="submit"class="btn btn-primary">
                        Add Creature
                    </button>

                    <a href="{% url 'world_explorer' story.id %}" class="btn btn-outline-secondary ms-2">
                        Back to World Explorer
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
