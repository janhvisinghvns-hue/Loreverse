{% extends "loreverse/layout.html" %}

{% block body %}

<div class="container py-5">
    <div class="form-page">
        <div class="form-page-header">
            <p class="text-muted text-uppercase small fw-semibold mb-2">
                {{ story.title }}
            </p>
            <h1 class="fw-bold">Create World</h1>
            <p class="text-muted">
                Build the world behind your story.
            </p>
        </div>

        <div class="form-card">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold">
                        World Description
                    </label>

                    <textarea name="description" id="description" rows="8"class="form-control"
                    placeholder="Describe the world, its atmosphere, history, or anything readers should know..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit"class="btn btn-primary">
                        Create World
                    </button>

                    <a href="{% url 'my_stories' %}" class="btn btn-outline-secondary ms-2">
                        Back to My Stories
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
