{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loreverse</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'loreverse/styles.css' %}">
</head>

<body>

<div id="page-loader" aria-hidden="true">
  <div class="loader-spinner"></div>
  <p>Entering Loreverse...</p>
</div>
<nav class="navbar navbar-expand-lg bg-body-tertiary px-3">

  <div class="container-fluid">

    <a class="navbar-brand" href="{% url 'index' %}">Loreverse</a>

    <button class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
        aria-controls="mainNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
    </button>
    <button
    type="button"
    id="theme-toggle"
    class="btn btn-outline-secondary me-2"
    aria-label="Toggle dark mode">
    🌙
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">

      <form class="d-flex mx-lg-4 my-2 my-lg-0"
          method="get"
          action="{% url 'published_stories' %}">

          <input class="form-control me-2"
          type="search"name="q" placeholder="Search stories or authors..." value="{{ query|default:'' }}">

          <button class="btn btn-outline-secondary"type="submit">Search</button>

      </form>


      <div class="ms-lg-auto d-flex flex-column flex-lg-row gap-2">

        {% if user.is_authenticated %}

          <a class="btn btn-outline-success" href="{% url 'reader_dashboard' %}">Reader Dashboard</a>

          {% if request.resolver_match.url_name != "profile" %}
            <a class="btn btn-outline-primary" href="{% url 'profile' %}">Profile</a>
          {% endif %}
          <a class="btn btn-outline-danger" href="{% url 'logout' %}">Logout</a>

        {% else %}
          <a class="btn btn-outline-primary" href="{% url 'login' %}">Login</a>
          <a class="btn btn-primary" href="{% url 'register' %}">Register</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>


<main>
    {% block body %}
    {% endblock %}
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const themeToggle = document.getElementById("theme-toggle");
    const savedTheme = localStorage.getItem("loreverse-theme");

    if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
        themeToggle.textContent = "☀️";
    }

    themeToggle.addEventListener("click", function () {
        document.body.classList.toggle("dark-mode");
        if (document.body.classList.contains("dark-mode")) {
            localStorage.setItem("loreverse-theme", "dark");
            themeToggle.textContent = "☀️";
        } else {
            localStorage.setItem("loreverse-theme", "light");
            themeToggle.textContent = "🌙";
        }
    });
    window.addEventListener("load", function () {
        const loader = document.getElementById("page-loader");
        setTimeout(function () {
            loader.classList.add("loader-hidden");
        }, 250);
    });
</script>

</body>
</html>
