{% extends "loreverse/layout.html" %}

{% block body %}

<h2>Add World Image</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Add Image</button>
</form>

<a href="{% url 'world_explorer' story.id %}">
    Back to World Explorer
</a>

{% endblock %}
