{% extends "loreverse/layout.html" %}

{% block body %}

<div class="container py-5">
    <div class="form-page">
        <div class="form-page-header">
            <p class="text-muted text-uppercase small fw-semibold mb-2">Join Loreverse</p>
            <h1 class="fw-bold">Create an Account</h1>
            <p class="text-muted">
                Create your account and start exploring stories and worlds.
            </p>
        </div>

        <div class="form-card">
            {% if message %}
                <div class="alert alert-danger">  {{ message }} </div>
            {% endif %}

            <form action="{% url 'register' %}" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username">Username</label>
                    <input type="text" id="username"  name="username"   class="form-control"
                        placeholder="Choose a username"
                    >
                </div>

                <div class="mb-3">
                    <label for="email">Email</label>
                    <input type="email"  id="email"  name="email"
                        class="form-control" placeholder="Enter your email"
                    >
                </div>

                <div class="mb-3">
                    <label for="password">Password</label>
                    <input  type="password" id="password"  name="password"
                        class="form-control"  placeholder="Create a password"
                    >
                </div>

                <div class="mb-3">
                    <label for="confirmation">Confirm Password</label>
                    <input
                        type="password"  id="confirmation"  name="confirmation"
                        class="form-control"  placeholder="Confirm your password"
                    >
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary"> Create Account</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
