{% extends "loreverse/layout.html" %}

{% block body %}

<div class="container py-5">
    <div class="form-page">
        <div class="form-page-header">
            <p class="text-muted text-uppercase small fw-semibold mb-2">
                {{ story.title }}
            </p>
            <h1 class="fw-bold">Add Chapter</h1>
            <p class="text-muted">
                Continue building your story with a new chapter.
            </p>
        </div>

        <div class="form-card">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        Add Chapter
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
