{% extends "loreverse/layout.html" %}

{% block body %}

<h2>Delete Story</h2>

<p>Are you sure you want to delete "{{ story.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'my_stories' %}">Cancel</a>
</form>

{% endblock %}
